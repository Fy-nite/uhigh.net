name: "Build and Test"

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup dotnet
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
    - name: Build
      run: dotnet build ./uhigh.csproj
    - name: Upload Build
      uses: actions/upload-artifact@v4
      with:
        name: uhigh build files
        path: |
          bin/Debug/net8.0
    - name: Test
      run: dotnet ./bin/Debug/net8.0/uhigh.dll test